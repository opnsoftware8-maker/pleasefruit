<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Island Fruits — Phase 1</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6fb7e8; touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, sans-serif; }
  #c { width: 100%; height: 100%; display: block; outline: none; }
  #zone { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); background: rgba(20,30,50,.6); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 15px; }
  #joy { position: fixed; left: calc(env(safe-area-inset-left, 0px) + 28px); bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.55); touch-action: none; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.8); }
  #log { display: none; position: fixed; left: 8px; right: 8px; top: 50px; max-height: 35%; overflow: auto; background: rgba(120,0,0,.8); color: #fff; font: 12px/1.4 monospace; padding: 8px; border-radius: 8px; white-space: pre-wrap; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1d2b3f; color: #fff; font-size: 18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="zone"></div>
<div id="joy"><div id="knob"></div></div>
<div id="log"></div>
<div id="load">กำลังโหลดเกาะ…</div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.0.0/babylonjs.loaders.min.js"></script>
<script src="config.js"></script>
<script src="src/events.js"></script>
<script src="src/health.js"></script>
<script src="src/debug.js"></script>
  <script src="src/combat.js"></script>
<script src="game.js"></script>
</body>
</html>
